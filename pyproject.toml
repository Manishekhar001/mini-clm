[project]
name = "mini-clm"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6,<2.8",
    "transformers>=4.51,<5",
    "datasets",
    "numpy",
    "requests",
    "huggingface_hub",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true